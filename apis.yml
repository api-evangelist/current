apis:
- aid: current:current-data-access
  name: Current Consumer Data Access (Aggregator-Only)
  description: >-
    Current does not expose a first-party public API or developer portal. The only documented,
    programmatic path to a member's Current account data (balances, transaction history, account
    and identity details, and account/routing verification for ACH) is through consumer-permissioned
    open-finance aggregators — Plaid is the documented connector for Current. Access is mediated by
    the aggregator, not by a Current-published API contract: there is no downloadable OpenAPI,
    Swagger, or Postman collection, no first-party OAuth authorization server, and no published
    baseURL. Integration follows the aggregator's own developer program, credentials, and consent
    flow. This entry is recorded honestly as an aggregator-only posture, not a Current-owned API
    product.
  humanURL: https://plaid.com/institutions/
