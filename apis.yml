aid: current
name: Current
kind: company
description: >-
  Current (Finco Services, Inc.) is a New York City-based U.S. financial technology company
  operating a mobile-first consumer banking platform serving over six million members. Through
  partner banks Choice Financial Group and Cross River Bank it offers fee-free spending accounts
  with early direct deposit (up to two days early), fee-free overdraft, and paycheck advances;
  Savings Pods earning competitive APY with automated Round-Ups; the Build Card for responsible
  credit building without a traditional credit check; fee-free cryptocurrency trading; and teen
  banking accounts with parental controls and automatic allowances. Current is a technology
  company, not a bank. It does NOT publish a first-party public developer API or developer portal —
  no developer.current.com (does not resolve), current.com/developers and current.com/api return
  404, and api.current.com is an undocumented mobile-app backend. Programmatic access to member
  account data is available only through third-party open-finance aggregators (Plaid), on a
  consumer-permissioned basis. This profile captures the company's public web, legal, and security
  surface and its aggregator-only data-access posture.
